<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="age-prompt" class="visible">
            <h1>Welcome! please insert your age to complete</h1>
            <input type="number" id="age-input" placeholder="insert here">
            <button onclick="checkAge()">ok</button>
        </div>
        <div id="Calculator">
            <h1>Calculator</h1>
            <input type="text" id="display" readonly>
            <div class="buttons">
            <button class="clear" onclick="clearDisplay()">clear</button>
            <button class="delete" onclick="deleteLast()">Delete</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('/')">/</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('*')">*</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button class="operator" onclick="appendToDisplay('-')">-</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>
            </div>
        </div>

        <div id="apology">
            <h1>apology</h1>
            <p>You must be at least 18 years old to use this calculator.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
